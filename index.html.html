<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aplikasi Kasir</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #f3f5f9; --card: #ffffff; --text: #1d2433; --muted: #6b7388;
    --primary: #2563eb; --primary-d: #1d4ed8; --danger: #dc2626; --ok: #16a34a;
    --border: #dfe3ec;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--primary); color: #fff; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 20px; }
  header input { padding: 6px 10px; border-radius: 6px; border: none; min-width: 180px; }
  main { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; padding: 16px; max-width: 1300px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .card h2 { margin: 0 0 12px; font-size: 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row > * { flex: 0 0 auto; }
  input, select, button { font: inherit; }
  input[type=text], input[type=number], select { padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: #fff; color: var(--text); }
  input.grow { flex: 1 1 160px; }
  button { padding: 8px 14px; border: 1px solid var(--border); background: #fff; border-radius: 8px; cursor: pointer; color: var(--text); }
  button:hover { background: #f0f3fa; }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
  button.primary:hover { background: var(--primary-d); }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
  #productGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; max-height: 58vh; overflow: auto; padding: 2px; }
  .prod { text-align: left; padding: 10px; border: 1px solid var(--border); border-radius: 10px; background: #fff; display: flex; flex-direction: column; gap: 4px; }
  .prod:hover { border-color: var(--primary); box-shadow: 0 0 0 2px #2563eb22; }
  .prod .kode { font-size: 11px; color: var(--muted); }
  .prod .nama { font-weight: 600; font-size: 14px; }
  .prod .harga { color: var(--primary); font-weight: 700; }
  .prod .stok { font-size: 12px; color: var(--muted); }
  .prod.habis { opacity: .45; }
  .empty { color: var(--muted); text-align: center; padding: 30px 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 6px 4px; border-bottom: 1px solid var(--border); text-align: left; }
  th.r, td.r { text-align: right; }
  .qty { display: inline-flex; align-items: center; gap: 4px; }
  .qty button { padding: 2px 8px; }
  .qty input.qtyin { width: 56px; padding: 4px 6px; text-align: center; border: 1px solid var(--border); border-radius: 6px; }
  .sum { margin-top: 12px; display: grid; gap: 6px; }
  .sum div { display: flex; justify-content: space-between; }
  .sum .total { font-size: 22px; font-weight: 800; border-top: 2px dashed var(--border); padding-top: 8px; margin-top: 4px; }
  .sum .minus { color: var(--danger); }
  .field { display: grid; gap: 4px; margin-top: 10px; }
  .field label { font-size: 13px; color: var(--muted); }
  .kembali { font-weight: 700; }
  .kembali.kurang { color: var(--danger); }
  .kembali.ok { color: var(--ok); }
  details { margin-top: 12px; }
  summary { cursor: pointer; font-weight: 600; }
  #struk { display: none; }
  @media print {
    body * { visibility: hidden; }
    #struk, #struk * { visibility: visible; }
    #struk { display: block; position: absolute; left: 0; top: 0; width: 72mm; font-family: "Courier New", monospace; font-size: 12px; color: #000; }
    #struk .c { text-align: center; }
    #struk .l { display: flex; justify-content: space-between; }
    #struk hr { border: none; border-top: 1px dashed #000; margin: 4px 0; }
  }
</style>
</head>
<body>

<header>
  <h1>🧾 Aplikasi Kasir</h1>
  <div class="row">
    <label for="namaToko">Nama toko:</label>
    <input type="text" id="namaToko" placeholder="Nama toko">
  </div>
</header>

<main>
  <!-- KIRI: PRODUK -->
  <section class="card">
    <h2>Produk</h2>
    <div class="row">
      <input type="text" id="cari" class="grow" placeholder="Cari nama / kode produk...">
      <select id="modeUpload" title="Mode upload">
        <option value="ganti">Upload: ganti semua</option>
        <option value="gabung">Upload: gabung/update</option>
      </select>
      <button class="primary" id="btnUpload">⬆ Upload Produk</button>
      <input type="file" id="fileInput" accept=".csv,.xlsx,.xls,.txt" hidden>
    </div>
    <p class="hint">Format file CSV/Excel dengan kolom: <b>kode, nama, harga, stok</b> (stok boleh dikosongkan).
      <a href="#" id="linkTemplate">Unduh template</a> ·
      <a href="#" id="linkContoh">Muat data contoh</a></p>

    <details>
      <summary>+ Tambah produk manual</summary>
      <div class="row" style="margin-top:8px">
        <input type="text" id="mKode" placeholder="Kode" style="width:90px">
        <input type="text" id="mNama" placeholder="Nama produk" class="grow">
        <input type="number" id="mHarga" placeholder="Harga" min="0" style="width:110px">
        <input type="number" id="mStok" placeholder="Stok" min="0" style="width:80px">
        <button id="btnTambah">Simpan</button>
      </div>
    </details>

    <div id="productGrid"></div>
    <div class="row" style="margin-top:10px; justify-content:space-between">
      <span class="hint" id="infoProduk"></span>
      <button class="danger" id="btnHapusProduk">Hapus semua produk</button>
    </div>
  </section>

  <!-- KANAN: KERANJANG -->
  <section class="card">
    <h2>Keranjang</h2>
    <div id="cartBox"></div>

    <div class="field">
      <label for="diskonNilai">Diskon (ketik angka)</label>
      <div class="row">
        <input type="number" id="diskonNilai" min="0" step="any" placeholder="0" class="grow">
        <select id="diskonTipe">
          <option value="persen">%</option>
          <option value="rupiah">Rp</option>
        </select>
      </div>
    </div>

    <div class="row" style="margin-top:10px">
      <label><input type="checkbox" id="pakaiPpn" checked> Kenakan PPN 11%</label>
    </div>

    <div class="sum">
      <div><span>Subtotal</span><span id="vSubtotal">Rp 0</span></div>
      <div class="minus"><span>Diskon</span><span id="vDiskon">- Rp 0</span></div>
      <div><span>Setelah diskon (DPP)</span><span id="vDpp">Rp 0</span></div>
      <div><span>PPN 11%</span><span id="vPpn">Rp 0</span></div>
      <div class="total"><span>TOTAL</span><span id="vTotal">Rp 0</span></div>
    </div>

    <div class="field">
      <label for="bayar">Uang diterima</label>
      <input type="number" id="bayar" min="0" placeholder="0">
      <div class="row" style="justify-content:space-between">
        <span>Kembalian</span>
        <span id="vKembali" class="kembali">Rp 0</span>
      </div>
    </div>

    <div class="row" style="margin-top:14px">
      <button class="primary" id="btnBayar" style="flex:1">💳 Bayar & Cetak Struk</button>
      <button class="danger" id="btnKosong">Kosongkan</button>
    </div>
  </section>
</main>

<!-- STRUK (hanya tampil saat print) -->
<div id="struk"></div>

<script>
(function () {
  'use strict';
  const PPN_RATE = 0.11;
  const LS_PROD = 'kasir_products_v1';
  const LS_TOKO = 'kasir_toko_v1';
  const LS_NOTA = 'kasir_nota_v1';

  const $ = id => document.getElementById(id);
  const rupiah = n => 'Rp ' + Math.round(n).toLocaleString('id-ID');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  let products = [];   // {kode, nama, harga, stok|null}
  let cart = {};       // kode -> qty

  /* ---------- Penyimpanan ---------- */
  function save() { try { localStorage.setItem(LS_PROD, JSON.stringify(products)); } catch (e) {} }
  function load() {
    try { products = JSON.parse(localStorage.getItem(LS_PROD)) || []; } catch (e) { products = []; }
    try { $('namaToko').value = localStorage.getItem(LS_TOKO) || 'TOKO SAYA'; } catch (e) { $('namaToko').value = 'TOKO SAYA'; }
  }

  /* ---------- Parsing file ---------- */
  function parseNumber(v) {
    if (typeof v === 'number') return v;
    let s = String(v == null ? '' : v).replace(/[^\d,.\-]/g, '');
    if (!s) return NaN;
    const hasDot = s.includes('.'), hasComma = s.includes(',');
    if (hasDot && hasComma) {
      s = s.lastIndexOf('.') > s.lastIndexOf(',') ? s.replace(/,/g, '') : s.replace(/\./g, '').replace(',', '.');
    } else if (hasDot) {
      if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
    } else if (hasComma) {
      s = /^-?\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g, '') : s.replace(',', '.');
    }
    return parseFloat(s);
  }

  function parseCSV(text) {
    text = text.replace(/^\uFEFF/, '');
    const first = text.split(/\r?\n/)[0] || '';
    const count = ch => (first.match(new RegExp('\\' + ch, 'g')) || []).length;
    let delim = ',';
    if (count(';') > count(',')) delim = ';';
    else if (count('\t') > count(',')) delim = '\t';
    const rows = []; let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
        else cur += c;
      } else if (c === '"') q = true;
      else if (c === delim) { row.push(cur); cur = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(cur); cur = '';
        if (row.some(x => x.trim() !== '')) rows.push(row);
        row = [];
      } else cur += c;
    }
    row.push(cur);
    if (row.some(x => x.trim() !== '')) rows.push(row);
    return rows;
  }

  const ALIAS = {
    kode:  ['kode', 'kodeproduk', 'kodebarang', 'sku', 'code', 'id', 'barcode'],
    nama:  ['nama', 'namaproduk', 'namabarang', 'produk', 'barang', 'name', 'product'],
    harga: ['harga', 'hargajual', 'hargasatuan', 'price'],
    stok:  ['stok', 'stock', 'qty', 'jumlah']
  };
  const norm = s => String(s == null ? '' : s).toLowerCase().replace(/[^a-z]/g, '');

  function rowsToProducts(rows) {
    if (!rows.length) throw new Error('File kosong.');
    const head = rows[0].map(norm);
    const find = key => head.findIndex(h => ALIAS[key].includes(h));
    const iKode = find('kode'), iNama = find('nama'), iHarga = find('harga'), iStok = find('stok');
    if (iNama < 0 || iHarga < 0) throw new Error('Kolom "nama" dan "harga" tidak ditemukan di baris pertama. Gunakan template yang disediakan.');
    const out = []; let auto = 1;
    for (let r = 1; r < rows.length; r++) {
      const row = rows[r];
      const nama = String(row[iNama] == null ? '' : row[iNama]).trim();
      const harga = parseNumber(row[iHarga]);
      if (!nama || isNaN(harga) || harga < 0) continue;
      let kode = iKode >= 0 ? String(row[iKode] == null ? '' : row[iKode]).trim() : '';
      if (!kode) kode = 'P' + String(auto++).padStart(3, '0');
      let stok = null;
      if (iStok >= 0 && String(row[iStok] == null ? '' : row[iStok]).trim() !== '') {
        const s = parseNumber(row[iStok]); stok = isNaN(s) ? null : Math.max(0, Math.round(s));
      }
      out.push({ kode, nama, harga: Math.round(harga), stok });
    }
    if (!out.length) throw new Error('Tidak ada baris produk yang valid.');
    return out;
  }

  function handleFile(file) {
    const name = file.name.toLowerCase();
    const reader = new FileReader();
    reader.onerror = () => alert('Gagal membaca file.');
    const done = list => {
      if ($('modeUpload').value === 'ganti') {
        products = list;
      } else {
        const map = new Map(products.map(p => [p.kode, p]));
        list.forEach(p => map.set(p.kode, p));
        products = Array.from(map.values());
      }
      save(); renderProducts();
      alert(list.length + ' produk berhasil dimuat.');
    };
    try {
      if (/\.(xlsx|xls)$/.test(name)) {
        if (typeof XLSX === 'undefined') { alert('Library Excel belum termuat (butuh internet). Gunakan file CSV.'); return; }
        reader.onload = e => {
          try {
            const wb = XLSX.read(e.target.result, { type: 'array' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: true });
            done(rowsToProducts(rows.filter(r => r.some(x => String(x).trim() !== ''))));
          } catch (err) { alert(err.message); }
        };
        reader.readAsArrayBuffer(file);
      } else {
        reader.onload = e => {
          try { done(rowsToProducts(parseCSV(e.target.result))); } catch (err) { alert(err.message); }
        };
        reader.readAsText(file);
      }
    } catch (err) { alert(err.message); }
  }

  function download(filename, content) {
    const blob = new Blob(['\uFEFF' + content], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  const CONTOH = [
    ['kode', 'nama', 'harga', 'stok'],
    ['P001', 'Beras 5 kg', 68000, 40],
    ['P002', 'Minyak Goreng 1 L', 18000, 60],
    ['P003', 'Gula Pasir 1 kg', 16500, 50],
    ['P004', 'Telur Ayam 1 kg', 28000, 30],
    ['P005', 'Mie Instan', 3500, 200],
    ['P006', 'Kopi Sachet', 2000, 300],
    ['P007', 'Air Mineral 600 ml', 3000, 120],
    ['P008', 'Sabun Mandi', 4500, 80]
  ];

  /* ---------- Render produk ---------- */
  function renderProducts() {
    const q = $('cari').value.trim().toLowerCase();
    const list = products.filter(p => !q || p.nama.toLowerCase().includes(q) || p.kode.toLowerCase().includes(q));
    const grid = $('productGrid');
    if (!products.length) {
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1">Belum ada produk.<br>Upload file CSV/Excel, tambah manual, atau muat data contoh.</div>';
    } else if (!list.length) {
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1">Produk tidak ditemukan.</div>';
    } else {
      grid.innerHTML = list.map(p => {
        const habis = p.stok !== null && p.stok <= 0;
        return '<button class="prod' + (habis ? ' habis' : '') + '" data-kode="' + esc(p.kode) + '"' + (habis ? ' disabled' : '') + '>' +
          '<span class="kode">' + esc(p.kode) + '</span>' +
          '<span class="nama">' + esc(p.nama) + '</span>' +
          '<span class="harga">' + rupiah(p.harga) + '</span>' +
          '<span class="stok">' + (p.stok === null ? 'Stok: -' : (habis ? 'Habis' : 'Stok: ' + p.stok)) + '</span></button>';
      }).join('');
    }
    $('infoProduk').textContent = products.length + ' produk tersimpan di browser ini';
  }

  /* ---------- Keranjang & hitung ---------- */
  const findProd = kode => products.find(p => p.kode === kode);

  function addToCart(kode) {
    const p = findProd(kode); if (!p) return;
    const now = cart[kode] || 0;
    if (p.stok !== null && now + 1 > p.stok) { alert('Stok "' + p.nama + '" tidak cukup.'); return; }
    cart[kode] = now + 1; renderCart();
  }
  function changeQty(kode, d) {
    const p = findProd(kode); const next = (cart[kode] || 0) + d;
    if (next <= 0) delete cart[kode];
    else if (p && p.stok !== null && next > p.stok) { alert('Stok "' + p.nama + '" tidak cukup.'); return; }
    else cart[kode] = next;
    renderCart();
  }

  function calc() {
    let subtotal = 0;
    Object.keys(cart).forEach(k => { const p = findProd(k); if (p) subtotal += p.harga * cart[k]; });
    const nilai = Math.max(0, parseFloat($('diskonNilai').value) || 0);
    let diskon = $('diskonTipe').value === 'persen' ? subtotal * Math.min(nilai, 100) / 100 : nilai;
    diskon = Math.round(Math.min(diskon, subtotal));
    const dpp = subtotal - diskon;
    const ppn = $('pakaiPpn').checked ? Math.round(dpp * PPN_RATE) : 0;
    return { subtotal, diskon, dpp, ppn, total: dpp + ppn };
  }

  function renderCart() {
    const keys = Object.keys(cart).filter(k => findProd(k));
    Object.keys(cart).forEach(k => { if (!findProd(k)) delete cart[k]; });
    if (!keys.length) {
      $('cartBox').innerHTML = '<div class="empty">Keranjang kosong. Klik produk untuk menambah.</div>';
    } else {
      $('cartBox').innerHTML = '<table><thead><tr><th>Item</th><th>Qty</th><th class="r">Jumlah</th><th></th></tr></thead><tbody>' +
        keys.map(k => {
          const p = findProd(k);
          return '<tr><td>' + esc(p.nama) + '<br><small style="color:var(--muted)">' + rupiah(p.harga) + '</small></td>' +
            '<td><span class="qty"><button data-act="min" data-kode="' + esc(k) + '">−</button><input type="number" class="qtyin" data-act="qty" data-kode="' + esc(k) + '" value="' + cart[k] + '" min="0" step="1" inputmode="numeric"><button data-act="plus" data-kode="' + esc(k) + '">+</button></span></td>' +
            '<td class="r jml">' + rupiah(p.harga * cart[k]) + '</td>' +
            '<td><button class="danger" data-act="del" data-kode="' + esc(k) + '" title="Hapus">✕</button></td></tr>';
        }).join('') + '</tbody></table>';
    }
    updateTotals();
  }

  function updateTotals() {
    const t = calc();
    $('vSubtotal').textContent = rupiah(t.subtotal);
    $('vDiskon').textContent = '- ' + rupiah(t.diskon);
    $('vDpp').textContent = rupiah(t.dpp);
    $('vPpn').textContent = rupiah(t.ppn);
    $('vTotal').textContent = rupiah(t.total);
    const bayar = parseFloat($('bayar').value) || 0;
    const kem = bayar - t.total;
    const el = $('vKembali');
    el.textContent = kem >= 0 ? rupiah(kem) : 'Kurang ' + rupiah(-kem);
    el.className = 'kembali ' + (bayar === 0 ? '' : (kem >= 0 ? 'ok' : 'kurang'));
    $('btnBayar').disabled = t.total <= 0;
  }

  /* ---------- Bayar & struk ---------- */
  function bayar() {
    const keys = Object.keys(cart).filter(k => findProd(k));
    if (!keys.length) return;
    const t = calc();
    const uang = parseFloat($('bayar').value) || 0;
    if (uang < t.total) { alert('Uang diterima kurang dari total.'); $('bayar').focus(); return; }

    let nota = 1;
    try { nota = (parseInt(localStorage.getItem(LS_NOTA), 10) || 0) + 1; localStorage.setItem(LS_NOTA, nota); } catch (e) {}
    const now = new Date();
    const nilai = parseFloat($('diskonNilai').value) || 0;
    const labelDiskon = $('diskonTipe').value === 'persen' ? 'Diskon ' + nilai + '%' : 'Diskon';

    let html = '<div class="c"><b>' + esc($('namaToko').value || 'TOKO') + '</b><br>' +
      now.toLocaleString('id-ID') + '<br>No. ' + String(nota).padStart(5, '0') + '</div><hr>';
    keys.forEach(k => {
      const p = findProd(k);
      html += '<div>' + esc(p.nama) + '</div><div class="l"><span>' + cart[k] + ' x ' + rupiah(p.harga) + '</span><span>' + rupiah(p.harga * cart[k]) + '</span></div>';
    });
    html += '<hr><div class="l"><span>Subtotal</span><span>' + rupiah(t.subtotal) + '</span></div>';
    if (t.diskon > 0) html += '<div class="l"><span>' + labelDiskon + '</span><span>- ' + rupiah(t.diskon) + '</span></div>';
    if ($('pakaiPpn').checked) html += '<div class="l"><span>PPN 11%</span><span>' + rupiah(t.ppn) + '</span></div>';
    html += '<div class="l"><b>TOTAL</b><b>' + rupiah(t.total) + '</b></div><hr>' +
      '<div class="l"><span>Tunai</span><span>' + rupiah(uang) + '</span></div>' +
      '<div class="l"><span>Kembali</span><span>' + rupiah(uang - t.total) + '</span></div><hr>' +
      '<div class="c">Terima kasih!</div>';
    $('struk').innerHTML = html;

    // kurangi stok
    keys.forEach(k => { const p = findProd(k); if (p.stok !== null) p.stok = Math.max(0, p.stok - cart[k]); });
    save();

    window.print();

    cart = {}; $('bayar').value = ''; $('diskonNilai').value = '';
    renderProducts(); renderCart();
  }

  /* ---------- Event ---------- */
  $('btnUpload').onclick = () => $('fileInput').click();
  $('fileInput').onchange = e => { if (e.target.files[0]) handleFile(e.target.files[0]); e.target.value = ''; };
  $('cari').oninput = renderProducts;
  $('namaToko').oninput = () => { try { localStorage.setItem(LS_TOKO, $('namaToko').value); } catch (e) {} };

  $('productGrid').onclick = e => { const b = e.target.closest('.prod'); if (b && !b.disabled) addToCart(b.dataset.kode); };
  $('cartBox').onclick = e => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const k = b.dataset.kode;
    if (b.dataset.act === 'plus') changeQty(k, 1);
    else if (b.dataset.act === 'min') changeQty(k, -1);
    else { delete cart[k]; renderCart(); }
  };

  // Quantity bisa diketik langsung
  $('cartBox').addEventListener('input', e => {
    const i = e.target.closest('input[data-act="qty"]'); if (!i) return;
    const k = i.dataset.kode, p = findProd(k); if (!p) return;
    let v = parseInt(i.value, 10);
    if (isNaN(v) || v < 1) return;
    if (p.stok !== null && v > p.stok) { v = p.stok; i.value = v; alert('Stok "' + p.nama + '" hanya ' + p.stok + '.'); }
    cart[k] = v;
    i.closest('tr').querySelector('.jml').textContent = rupiah(p.harga * v);
    updateTotals();
  });
  $('cartBox').addEventListener('change', e => {
    const i = e.target.closest('input[data-act="qty"]'); if (!i) return;
    const k = i.dataset.kode;
    const v = parseInt(i.value, 10);
    if (!isNaN(v) && v <= 0) delete cart[k];
    renderCart();
  });

  ['diskonNilai', 'diskonTipe', 'pakaiPpn', 'bayar'].forEach(id => { $(id).oninput = updateTotals; $(id).onchange = updateTotals; });
  $('btnBayar').onclick = bayar;
  $('btnKosong').onclick = () => { if (Object.keys(cart).length && confirm('Kosongkan keranjang?')) { cart = {}; renderCart(); } };

  $('btnTambah').onclick = () => {
    const nama = $('mNama').value.trim(), harga = parseFloat($('mHarga').value);
    if (!nama || isNaN(harga) || harga < 0) { alert('Isi nama dan harga dengan benar.'); return; }
    let kode = $('mKode').value.trim() || 'P' + String(products.length + 1).padStart(3, '0');
    const stokTxt = $('mStok').value.trim();
    const item = { kode, nama, harga: Math.round(harga), stok: stokTxt === '' ? null : Math.max(0, parseInt(stokTxt, 10) || 0) };
    const idx = products.findIndex(p => p.kode === kode);
    if (idx >= 0) products[idx] = item; else products.push(item);
    ['mKode', 'mNama', 'mHarga', 'mStok'].forEach(id => $(id).value = '');
    save(); renderProducts();
  };

  $('btnHapusProduk').onclick = () => {
    if (products.length && confirm('Hapus SEMUA data produk?')) { products = []; cart = {}; save(); renderProducts(); renderCart(); }
  };
  $('linkTemplate').onclick = e => {
    e.preventDefault();
    download('template-produk.csv', 'kode,nama,harga,stok\nP001,Contoh Produk,10000,50\n');
  };
  $('linkContoh').onclick = e => {
    e.preventDefault();
    products = CONTOH.slice(1).map(r => ({ kode: r[0], nama: r[1], harga: r[2], stok: r[3] }));
    save(); renderProducts();
  };

  load(); renderProducts(); renderCart();
})();
</script>
</body>
</html>
